<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="100" y="110" width="440" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="320.0" y="149.16" font-size="24" text-anchor="middle" dominant-baseline="central">User holds keys</text><text x="320.0" y="180.84" font-size="24" text-anchor="middle" dominant-baseline="central">and final control</text><rect x="700" y="110" width="440" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="920.0" y="165.0" font-size="24" text-anchor="middle" dominant-baseline="central">User–Agent delegation</text><rect x="1300" y="110" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1540.0" y="149.16" font-size="24" text-anchor="middle" dominant-baseline="central">Agent works within</text><text x="1540.0" y="180.84" font-size="24" text-anchor="middle" dominant-baseline="central">a limited scope</text><rect x="560" y="400" width="440" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="780.0" y="439.16" font-size="24" text-anchor="middle" dominant-baseline="central">Generate</text><text x="780.0" y="470.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">Memory / State / Artifact</text><rect x="1300" y="400" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1540.0" y="439.16" font-size="24" text-anchor="middle" dominant-baseline="central">Gateway generates</text><text x="1540.0" y="470.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">access and runtime receipts</text><rect x="560" y="640" width="440" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="780.0" y="679.16" font-size="24" text-anchor="middle" dominant-baseline="central">Vault encrypts and</text><text x="780.0" y="710.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">saves with versions</text><rect x="860" y="860" width="640" height="120" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1180.0" y="904.16" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Proof aggregates provenance,</text><text x="1180.0" y="935.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">audit and storage evidence</text><path d="M540,165.0 L700,165.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1140,165.0 L1300,165.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1420.0,220 L1420.0,300 L780.0,300 L780.0,400" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1540.0,220 L1540.0,400" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M780.0,510 L780.0,640" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M780.0,750 L780.0,920.0 L860,920.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1540.0,510 L1540.0,920.0 L1500,920.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1180.0,980 L1180,1030 L50,1030 L50,165 L100,165.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="600" y="1000.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">control &amp; verification</text></svg>