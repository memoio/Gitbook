<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="80" y="90" width="360" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="260.0" y="140.0" font-size="24" text-anchor="middle" dominant-baseline="central">User root key</text><rect x="560" y="90" width="440" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="780.0" y="124.16" font-size="24" text-anchor="middle" dominant-baseline="central">Namespace / object</text><text x="780.0" y="155.84" font-size="24" text-anchor="middle" dominant-baseline="central">data key</text><rect x="1120" y="90" width="380" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1310.0" y="140.0" font-size="24" text-anchor="middle" dominant-baseline="central">Encrypted State Object</text><path d="M440,140.0 L560,140.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1000,140.0 L1120,140.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="80" y="380" width="360" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="260.0" y="430.0" font-size="24" text-anchor="middle" dominant-baseline="central">Restricted delegation</text><rect x="620" y="380" width="320" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="780.0" y="430.0" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Gateway</text><rect x="1120" y="380" width="300" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1270.0" y="430.0" font-size="24" text-anchor="middle" dominant-baseline="central">Revocation</text><path d="M440,430.0 L620,430.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1120,430.0 L940,430.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M780.0,380 L780.0,190" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="790" y="285.0" font-size="20" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">obtains limited capability after authorization</text><rect x="80" y="700" width="360" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="260.0" y="750.0" font-size="24" text-anchor="middle" dominant-baseline="central">Hard revocation</text><rect x="580" y="700" width="560" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="860.0" y="734.16" font-size="24" text-anchor="middle" dominant-baseline="central">Rotate the key and</text><text x="860.0" y="765.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">re-encrypt a new version</text><path d="M440,750.0 L580,750.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1560" y="90" width="320" height="430" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="10 7"/><text x="1720.0" y="242.3" font-size="19" text-anchor="middle" dominant-baseline="central">Key hierarchy: root key</text><text x="1720.0" y="267.38" font-size="19" text-anchor="middle" dominant-baseline="central">→ data key → encrypted</text><text x="1720.0" y="292.46000000000004" font-size="19" text-anchor="middle" dominant-baseline="central">object. Gateway obtains</text><text x="1720.0" y="317.54" font-size="19" text-anchor="middle" dominant-baseline="central">only a limited capability;</text><text x="1720.0" y="342.62" font-size="19" text-anchor="middle" dominant-baseline="central">the platform never gets</text><text x="1720.0" y="367.70000000000005" font-size="19" text-anchor="middle" dominant-baseline="central">the user root key.</text><rect x="1200" y="640" width="680" height="250" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="10 7"/><text x="1540.0" y="714.84" font-size="19" text-anchor="middle" dominant-baseline="central">The rotated object is the content data key, not the Agent</text><text x="1540.0" y="739.9200000000001" font-size="19" text-anchor="middle" dominant-baseline="central">identity signing key. Revocation constrains later managed</text><text x="1540.0" y="765.0" font-size="19" text-anchor="middle" dominant-baseline="central">requests once confirmed at enforcement points; re-encryption</text><text x="1540.0" y="790.08" font-size="19" text-anchor="middle" dominant-baseline="central">applies to the new envelope. Plaintext already read, old</text><text x="1540.0" y="815.1600000000001" font-size="19" text-anchor="middle" dominant-baseline="central">ciphertext and key copies are not automatically recalled.</text></svg>