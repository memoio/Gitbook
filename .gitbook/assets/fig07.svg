<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="220" y="40" width="460" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="450.0" y="90.0" font-size="24" text-anchor="middle" dominant-baseline="central">User DID / Wallet</text><rect x="860" y="40" width="560" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1140.0" y="74.16" font-size="24" text-anchor="middle" dominant-baseline="central">Agent DID:</text><text x="1140.0" y="105.84" font-size="24" text-anchor="middle" dominant-baseline="central">signing key and execution instance</text><rect x="500" y="220" width="400" height="90" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="700.0" y="265.0" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Delegation</text><path d="M450.0,140 L450.0,180 L700.0,180 L700.0,220" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="330" y="165.0" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">issues delegation</text><path d="M1140.0,140 L1140.0,180 L800.0,180 L800.0,220" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="330" y="390" width="740" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="700.0" y="440.0" font-size="24" text-anchor="middle" dominant-baseline="central">Execution instance instance_id  |  run run_id</text><rect x="480" y="560" width="440" height="90" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="700.0" y="605.0" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Gateway request</text><rect x="320" y="720" width="760" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="700.0" y="770.0" font-size="26" text-anchor="middle" dominant-baseline="central">Delegation, policy and revocation status valid?</text><rect x="140" y="910" width="440" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="360.0" y="960.0" font-size="24" text-anchor="middle" dominant-baseline="central">Access Vault</text><rect x="820" y="910" width="440" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1040.0" y="960.0" font-size="24" text-anchor="middle" dominant-baseline="central">Reject and generate receipt</text><path d="M700.0,310 L700.0,390" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M700.0,490 L700.0,560" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M700.0,650 L700.0,720" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M500.0,820 L500.0,865 L360.0,865 L360.0,910" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="330" y="845.0" font-size="22" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Yes</text><path d="M900.0,820 L900.0,865 L1040.0,865 L1040.0,910" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1020" y="845.0" font-size="22" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">No</text><rect x="1300" y="300" width="560" height="330" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="10 7"/><text x="1580.0" y="372.6" font-size="20" text-anchor="middle" dominant-baseline="central">Registering or holding an</text><text x="1580.0" y="399.0" font-size="20" text-anchor="middle" dominant-baseline="central">Agent DID does not grant</text><text x="1580.0" y="425.40000000000003" font-size="20" text-anchor="middle" dominant-baseline="central">data access. User delegation</text><text x="1580.0" y="451.8" font-size="20" text-anchor="middle" dominant-baseline="central">and the executing principal</text><text x="1580.0" y="478.20000000000005" font-size="20" text-anchor="middle" dominant-baseline="central">are expressed separately:</text><text x="1580.0" y="504.6" font-size="20" text-anchor="middle" dominant-baseline="central">User DID, Agent DID,</text><text x="1580.0" y="531.0" font-size="20" text-anchor="middle" dominant-baseline="central">instance_id and run_id</text><text x="1580.0" y="557.4000000000001" font-size="20" text-anchor="middle" dominant-baseline="central">are never merged.</text></svg>