<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="80" y="120" width="260" height="90" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="210.0" y="165.0" font-size="24" text-anchor="middle" dominant-baseline="central">Receipt 1</text><rect x="80" y="330" width="260" height="90" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="210.0" y="375.0" font-size="24" text-anchor="middle" dominant-baseline="central">Receipt 2</text><rect x="80" y="540" width="260" height="90" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="210.0" y="585.0" font-size="24" text-anchor="middle" dominant-baseline="central">Receipt n</text><rect x="520" y="120" width="300" height="510" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="670.0" y="375.0" font-size="26" text-anchor="middle" dominant-baseline="central" font-weight="700">Audit batch</text><path d="M340,165.0 L430.0,165.0 L430.0,375.0 L520,375.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M340,375.0 L520,375.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M340,585.0 L430.0,585.0 L430.0,375.0 L520,375.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="960" y="330" width="300" height="90" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1110.0" y="375.0" font-size="24" text-anchor="middle" dominant-baseline="central">Merkle Root</text><rect x="1400" y="330" width="440" height="90" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1620.0" y="375.0" font-size="24" text-anchor="middle" dominant-baseline="central">On-chain / public anchor</text><path d="M820,585.0 L890.0,585.0 L890.0,375.0 L960,375.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1260,375.0 L1400,375.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="80" y="760" width="300" height="90" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="230.0" y="805.0" font-size="24" text-anchor="middle" dominant-baseline="central">Merkle Proof</text><path d="M80,375.0 L40,375 L40,805 L80,805.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1400" y="760" width="440" height="90" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1620.0" y="805.0" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Third-party verification</text><path d="M1620.0,420 L1620.0,760" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M380,805.0 L1400,805.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="480" y="880" width="800" height="150" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="10 7"/><text x="880.0" y="917.38" font-size="19" text-anchor="middle" dominant-baseline="central">An inclusion proof verifies a receipt belongs to a specified root.</text><text x="880.0" y="942.46" font-size="19" text-anchor="middle" dominant-baseline="central">It does not prove the event is authentic, that no log entry is</text><text x="880.0" y="967.54" font-size="19" text-anchor="middle" dominant-baseline="central">missing, or that an Agent conclusion is correct. Original receipts</text><text x="880.0" y="992.62" font-size="19" text-anchor="middle" dominant-baseline="central">stay under access rules; their text is not shown here.</text></svg>