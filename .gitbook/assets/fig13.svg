<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="100" y="80" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="135.0" font-size="24" text-anchor="middle" dominant-baseline="central">1  Create an isolated workspace</text><rect x="720" y="80" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="135.0" font-size="24" text-anchor="middle" dominant-baseline="central">2  Register user and Agent</text><rect x="1340" y="80" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="119.16" font-size="24" text-anchor="middle" dominant-baseline="central">3  Load limited delegation</text><text x="1580.0" y="150.84" font-size="24" text-anchor="middle" dominant-baseline="central">signed by the Owner</text><rect x="1340" y="350" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="389.16" font-size="24" text-anchor="middle" dominant-baseline="central">4  Write memory and materials</text><text x="1580.0" y="420.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">after policy admission</text><rect x="720" y="350" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="389.16" font-size="24" text-anchor="middle" dominant-baseline="central">5  Execute the task and</text><text x="960.0" y="420.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">save a Checkpoint</text><rect x="100" y="350" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="405.0" font-size="24" text-anchor="middle" dominant-baseline="central">6  Resume after interruption</text><rect x="100" y="620" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="675.0" font-size="24" text-anchor="middle" dominant-baseline="central">7  View provenance and receipts</text><rect x="720" y="620" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="659.16" font-size="24" text-anchor="middle" dominant-baseline="central">8  A read after revocation</text><text x="960.0" y="690.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">should be denied</text><rect x="1340" y="620" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="659.16" font-size="24" text-anchor="middle" dominant-baseline="central">9  Export and clean up with</text><text x="1580.0" y="690.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">an independent authorization</text><path d="M580,135.0 L720,135.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1200,135.0 L1340,135.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1580.0,190 L1580.0,350" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1340,405.0 L1200,405.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M720,405.0 L580,405.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M340.0,460 L340.0,620" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M580,675.0 L720,675.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1200,675.0 L1340,675.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1000" y="847.65" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">The revocation test targets controlled access at the relevant enforcement points; export and cleanup use an independent valid delegation pre-signed by the Owner.</text><text x="1000" y="872.35" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Cleanup covers only test objects in the isolated workspace; recovery is bounded by dependency versions and external-action records in the Checkpoint.</text></svg>