<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="100" y="80" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="130.0" font-size="24" text-anchor="middle" dominant-baseline="central">Agent Framework Adapter</text><rect x="720" y="80" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="130.0" font-size="24" text-anchor="middle" dominant-baseline="central">Unified Event / Trace Schema</text><rect x="1340" y="80" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="130.0" font-size="24" text-anchor="middle" dominant-baseline="central">Memory Engine Adapter</text><rect x="1340" y="330" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="380.0" font-size="24" text-anchor="middle" dominant-baseline="central">Candidate memory</text><rect x="720" y="330" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="364.16" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Source, purpose and</text><text x="960.0" y="395.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">admission policy check</text><rect x="100" y="330" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="364.16" font-size="24" text-anchor="middle" dominant-baseline="central">Quarantine candidate or</text><text x="340.0" y="395.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">clean up per retention policy</text><rect x="720" y="580" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="630.0" font-size="24" text-anchor="middle" dominant-baseline="central">Vault canonical memory record</text><rect x="1340" y="580" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="630.0" font-size="24" text-anchor="middle" dominant-baseline="central">Gateway authorized retrieval</text><path d="M580,130.0 L720,130.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1200,130.0 L1340,130.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1580.0,180 L1580.0,330" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1340,380.0 L1200,380.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M720,380.0 L580,380.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="650" y="355.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Rejected</text><path d="M960.0,430 L960.0,580" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="980" y="492.65" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Check passed and</text><text x="980" y="517.35" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">write authorized</text><path d="M1200,630.0 L1340,630.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="100" y="800" width="1720" height="170" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="10 7"/><text x="960.0" y="872.46" font-size="19" text-anchor="middle" dominant-baseline="central">The admission policy automatically checks source signatures, field patterns, purpose, write permission and conflicts within the scope pre-signed by the Owner;</text><text x="960.0" y="897.5400000000001" font-size="19" text-anchor="middle" dominant-baseline="central">a canonical memory version is created on pass, and retrieval stays under independent authorization. "confirmed" means policy admission passed, not that content is absolutely true.</text></svg>