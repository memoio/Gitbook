<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="120" y="130" width="140" height="70" fill="#fff" stroke="#000" stroke-width="2.5" stroke-dasharray="10 7"/><text x="190.0" y="165.0" font-size="22" text-anchor="middle" dominant-baseline="central">Start</text><rect x="720" y="120" width="480" height="90" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="165.0" font-size="28" text-anchor="middle" dominant-baseline="central" font-weight="700">KeyCreated</text><rect x="260" y="430" width="400" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="460.0" y="480.0" font-size="28" text-anchor="middle" dominant-baseline="central" font-weight="700">Unbound</text><rect x="1260" y="430" width="400" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1460.0" y="480.0" font-size="28" text-anchor="middle" dominant-baseline="central" font-weight="700">Bound</text><rect x="760" y="720" width="400" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="770.0" font-size="28" text-anchor="middle" dominant-baseline="central" font-weight="700">Revoked</text><rect x="890" y="890" width="140" height="70" fill="#fff" stroke="#000" stroke-width="2.5" stroke-dasharray="10 7"/><text x="960.0" y="925.0" font-size="22" text-anchor="middle" dominant-baseline="central">End</text><path d="M260,165.0 L720,165.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="470" y="77.65" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">locally generate identity</text><text x="470" y="102.35000000000001" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">signing key and instance_id</text><path d="M810.0,210 L810.0,330 L460.0,330 L460.0,430" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="560" y="287.65" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">proof of control passed,</text><text x="560" y="312.34999999999997" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Agent DID created</text><path d="M660,480 L1260,480" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="960" y="456.0" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Owner signature + Agent binding proof</text><path d="M1260,510 L660,510" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="960" y="536.0" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Owner unbinds</text><path d="M460.0,530 L460.0,770.0 L760,770.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="480" y="650.0" font-size="21" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Revoke</text><path d="M1460.0,530 L1460.0,770.0 L1160,770.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1440" y="650.0" font-size="21" text-anchor="end" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Revoke</text><path d="M960.0,820 L960.0,890" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="960" y="1007.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Unbinding the user and revoking the identity are different actions; binding and operation delegation are validated separately.</text><text x="960" y="1033.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Registration and binding do not guarantee access authorization; a new task run_id is not a new state.</text></svg>