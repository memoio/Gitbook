<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="80" y="60" width="380" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="270.0" y="110.0" font-size="24" text-anchor="middle" dominant-baseline="central">User DID</text><rect x="640" y="60" width="380" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="830.0" y="110.0" font-size="24" text-anchor="middle" dominant-baseline="central">Delegation v1</text><rect x="1200" y="60" width="380" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1390.0" y="110.0" font-size="24" text-anchor="middle" dominant-baseline="central">Agent DID</text><rect x="80" y="300" width="380" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="270.0" y="350.0" font-size="24" text-anchor="middle" dominant-baseline="central">instance_id</text><rect x="640" y="300" width="380" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="830.0" y="350.0" font-size="24" text-anchor="middle" dominant-baseline="central">run_id</text><rect x="1200" y="300" width="380" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1390.0" y="350.0" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Gateway</text><rect x="1640" y="300" width="240" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1760.0" y="336.14" font-size="21" text-anchor="middle" dominant-baseline="central">Revocation</text><text x="1760.0" y="363.86" font-size="21" text-anchor="middle" dominant-baseline="central">Registry</text><path d="M460,110.0 L640,110.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="550.0" y="90.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">issues</text><path d="M1020,110.0 L1200,110.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1390.0,160 L1390.0,230 L270.0,230 L270.0,300" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M460,350.0 L640,350.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1020,350.0 L1200,350.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1640,350.0 L1580,350.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="700" y="560" width="1000" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1200.0" y="615.0" font-size="26" text-anchor="middle" dominant-baseline="central" font-weight="700">Principal × namespace × operation × term × purpose</text><path d="M1390.0,400 L1390.0,480.0 L1200.0,480.0 L1200.0,560" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="700" y="820" width="400" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="900.0" y="870.0" font-size="24" text-anchor="middle" dominant-baseline="central">Vault</text><rect x="1300" y="820" width="400" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1500.0" y="870.0" font-size="24" text-anchor="middle" dominant-baseline="central">Denial receipt</text><path d="M900.0,670 L900.0,820" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="860" y="725.0" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">allow</text><path d="M1500.0,670 L1500.0,820" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1540" y="725.0" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">deny</text><rect x="80" y="560" width="560" height="360" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="10 7"/><text x="360.0" y="664.76" font-size="19" text-anchor="middle" dominant-baseline="central">The revocation registry is an input to the</text><text x="360.0" y="689.84" font-size="19" text-anchor="middle" dominant-baseline="central">managed policy check; enforcement points</text><text x="360.0" y="714.92" font-size="19" text-anchor="middle" dominant-baseline="central">use valid revocation records and deny when a</text><text x="360.0" y="740.0" font-size="19" text-anchor="middle" dominant-baseline="central">record times out or cannot be verified. The</text><text x="360.0" y="765.08" font-size="19" text-anchor="middle" dominant-baseline="central">five dimensions are checked together; allow</text><text x="360.0" y="790.16" font-size="19" text-anchor="middle" dominant-baseline="central">is only an authorization decision, not a</text><text x="360.0" y="815.24" font-size="19" text-anchor="middle" dominant-baseline="central">guarantee that the read/write succeeds.</text></svg>