<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="100" y="60" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="110.0" font-size="24" text-anchor="middle" dominant-baseline="central">Source</text><rect x="720" y="60" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="110.0" font-size="24" text-anchor="middle" dominant-baseline="central">Transform / Tool / Model</text><rect x="1340" y="60" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="110.0" font-size="24" text-anchor="middle" dominant-baseline="central">Candidate Memory</text><rect x="1340" y="320" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="375.0" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Source complete? Purpose allowed?</text><rect x="720" y="320" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="359.16" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Signature, fields and</text><text x="960.0" y="390.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">conflict policy passed?</text><rect x="100" y="320" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="375.0" font-size="24" text-anchor="middle" dominant-baseline="central">Confirmed Memory + Version</text><rect x="1340" y="590" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="624.16" font-size="24" text-anchor="middle" dominant-baseline="central">Refuse entry into</text><text x="1580.0" y="655.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">long-term memory</text><rect x="720" y="590" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="640.0" font-size="24" text-anchor="middle" dominant-baseline="central">Quarantined Memory</text><rect x="100" y="590" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="640.0" font-size="24" text-anchor="middle" dominant-baseline="central">Provenance + Receipt + Proof Ref</text><path d="M580,110.0 L720,110.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1200,110.0 L1340,110.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1580.0,160 L1580.0,320" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1580.0,430 L1580.0,590" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1592.0" y="510.0" font-size="21" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">No</text><path d="M1340,375.0 L1200,375.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1270.0" y="355.0" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Yes</text><path d="M720,375.0 L580,375.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="650.0" y="355.0" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Passed</text><path d="M960.0,430 L960.0,590" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="972.0" y="510.0" font-size="21" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Not passed</text><path d="M340.0,430 L340.0,590" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="100" y="800" width="1720" height="170" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="10 7"/><text x="960.0" y="872.46" font-size="19" text-anchor="middle" dominant-baseline="central">Source completeness, purpose permission and automated admission are different judgments. "confirmed" means the admission policy passed,</text><text x="960.0" y="897.5400000000001" font-size="19" text-anchor="middle" dominant-baseline="central">with policy reference, verifying principal and version retained; it does not mean the content is semantically true. Reject and quarantine are separate end points.</text></svg>