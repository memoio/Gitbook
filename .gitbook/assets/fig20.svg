<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="80" y="50" width="400" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="280.0" y="100.0" font-size="24" text-anchor="middle" dominant-baseline="central">High-risk action request</text><rect x="600" y="50" width="440" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="820.0" y="100.0" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Independent permission valid?</text><rect x="1160" y="50" width="380" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1350.0" y="100.0" font-size="24" text-anchor="middle" dominant-baseline="central">Reject and record</text><rect x="600" y="250" width="440" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="820.0" y="289.16" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Purpose, quota and</text><text x="820.0" y="320.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">risk policy passed?</text><rect x="600" y="460" width="440" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="820.0" y="499.16" font-size="24" text-anchor="middle" dominant-baseline="central">Record operation_id and</text><text x="820.0" y="530.84" font-size="24" text-anchor="middle" dominant-baseline="central">pre-execution Checkpoint</text><rect x="1160" y="460" width="380" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1350.0" y="515.0" font-size="24" text-anchor="middle" dominant-baseline="central">Execute external action</text><rect x="1160" y="660" width="380" height="90" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1350.0" y="705.0" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Result</text><path d="M480,100.0 L600,100.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1040,100.0 L1160,100.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1100.0" y="80.0" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">No</text><path d="M820.0,150 L820.0,250" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="832.0" y="200.0" font-size="21" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Yes</text><path d="M1040,305.0 L1350.0,305.0 L1350.0,150" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1360" y="280.0" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Not passed</text><path d="M820.0,360 L820.0,460" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="832.0" y="410.0" font-size="21" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Passed</text><path d="M1040,515.0 L1160,515.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1350.0,570 L1350.0,660" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="80" y="880" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="320.0" y="930.0" font-size="24" text-anchor="middle" dominant-baseline="central">Record result and receipt</text><rect x="720" y="880" width="520" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="980.0" y="914.16" font-size="24" text-anchor="middle" dominant-baseline="central">Compensate per action</text><text x="980.0" y="945.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">semantics and record failure</text><rect x="1380" y="880" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1620.0" y="914.16" font-size="24" text-anchor="middle" dominant-baseline="central">Query and reconcile,</text><text x="1620.0" y="945.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">no automatic repeat</text><path d="M1230.0,750 L1230.0,810 L320.0,810 L320.0,880" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="330" y="790.0" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Success</text><path d="M1350.0,750 L1350.0,810 L980.0,810 L980.0,880" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1000" y="790.0" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Explicit failure</text><path d="M1470.0,750 L1470.0,810 L1620.0,810 L1620.0,880" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1620" y="790.0" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Unknown</text><rect x="1580" y="110" width="300" height="480" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="10 7"/><text x="1730.0" y="219.32" font-size="18" text-anchor="middle" dominant-baseline="central">The first check verifies the</text><text x="1730.0" y="243.07999999999998" font-size="18" text-anchor="middle" dominant-baseline="central">independent delegation; the</text><text x="1730.0" y="266.84" font-size="18" text-anchor="middle" dominant-baseline="central">second automatically verifies</text><text x="1730.0" y="290.6" font-size="18" text-anchor="middle" dominant-baseline="central">purpose, quota, target and</text><text x="1730.0" y="314.36" font-size="18" text-anchor="middle" dominant-baseline="central">risk constraints in the</text><text x="1730.0" y="338.12" font-size="18" text-anchor="middle" dominant-baseline="central">Owner's pre-signed policy.</text><text x="1730.0" y="361.88" font-size="18" text-anchor="middle" dominant-baseline="central">Compensation depends on</text><text x="1730.0" y="385.64" font-size="18" text-anchor="middle" dominant-baseline="central">action semantics and does</text><text x="1730.0" y="409.4" font-size="18" text-anchor="middle" dominant-baseline="central">not guarantee rollback.</text><text x="1730.0" y="433.15999999999997" font-size="18" text-anchor="middle" dominant-baseline="central">operation_id and the</text><text x="1730.0" y="456.92" font-size="18" text-anchor="middle" dominant-baseline="central">pre-execution Checkpoint are</text><text x="1730.0" y="480.68" font-size="18" text-anchor="middle" dominant-baseline="central">recorded before execution.</text></svg>