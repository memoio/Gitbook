<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="100" y="90" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="129.16" font-size="24" text-anchor="middle" dominant-baseline="central">Organization A:</text><text x="340.0" y="160.84" font-size="24" text-anchor="middle" dominant-baseline="central">Owner pre-signed policy</text><rect x="720" y="90" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="129.16" font-size="24" text-anchor="middle" dominant-baseline="central">Select state and</text><text x="960.0" y="160.84" font-size="24" text-anchor="middle" dominant-baseline="central">redact per policy</text><rect x="1340" y="90" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="129.16" font-size="24" text-anchor="middle" dominant-baseline="central">Memory Pack and</text><text x="1580.0" y="160.84" font-size="24" text-anchor="middle" dominant-baseline="central">provenance manifest</text><rect x="1340" y="390" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="429.16" font-size="24" text-anchor="middle" dominant-baseline="central">Encapsulate content keys</text><text x="1580.0" y="460.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">for Org B / Agent B</text><rect x="720" y="390" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="429.16" font-size="24" text-anchor="middle" dominant-baseline="central">Validate time-limited</text><text x="960.0" y="460.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">delegation: read / write / share</text><rect x="100" y="390" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="429.16" font-size="24" text-anchor="middle" dominant-baseline="central">A2A Task /</text><text x="340.0" y="460.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">secure transport</text><rect x="100" y="690" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="729.16" font-size="24" text-anchor="middle" dominant-baseline="central">Org B verifies signatures,</text><text x="340.0" y="760.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">provenance and policy</text><rect x="720" y="690" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="745.0" font-size="24" text-anchor="middle" dominant-baseline="central">Execute and return Artifact</text><rect x="1340" y="690" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="729.16" font-size="24" text-anchor="middle" dominant-baseline="central">Both parties save receive /</text><text x="1580.0" y="760.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">completion receipts</text><path d="M580,145.0 L720,145.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1200,145.0 L1340,145.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1580.0,200 L1580.0,390" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1340,445.0 L1200,445.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M720,445.0 L580,445.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M340.0,500 L340.0,690" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M580,745.0 L720,745.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1200,745.0 L1340,745.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="960" y="962.65" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Key encapsulation targets the receiving organization or Agent and never hands over the sender identity key; A2A or secure transport does not replace</text><text x="960" y="987.35" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">receiver-side verification of signatures, provenance and policy. The handoff has a selected scope, not whole-database sharing.</text></svg>