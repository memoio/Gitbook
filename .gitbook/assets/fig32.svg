<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="100" y="60" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="110.0" font-size="24" text-anchor="middle" dominant-baseline="central">Import sessions / traces / files</text><rect x="720" y="60" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="110.0" font-size="24" text-anchor="middle" dominant-baseline="central">Retain originals and provenance</text><rect x="1340" y="60" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="110.0" font-size="24" text-anchor="middle" dominant-baseline="central">Extract Candidate Memory</text><rect x="1340" y="320" width="480" height="120" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="364.16" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Signature, source, purpose</text><text x="1580.0" y="395.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">and conflict policy passed?</text><rect x="720" y="320" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="370.0" font-size="24" text-anchor="middle" dominant-baseline="central">Write admitted memory</text><rect x="100" y="320" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="354.16" font-size="24" text-anchor="middle" dominant-baseline="central">Save version, commitment</text><text x="340.0" y="385.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">and local receipt</text><rect x="1340" y="600" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="650.0" font-size="24" text-anchor="middle" dominant-baseline="central">Reject or quarantine candidate</text><rect x="100" y="600" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="650.0" font-size="24" text-anchor="middle" dominant-baseline="central">Searchable, exportable, deletable</text><path d="M580,110.0 L720,110.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1200,110.0 L1340,110.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1580.0,160 L1580.0,320" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1340,380.0 L1270.0,380.0 L1270.0,370.0 L1200,370.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1305.0" y="360.0" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">Yes</text><path d="M720,370.0 L580,370.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M340.0,420 L340.0,600" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1580.0,440 L1580.0,600" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1592.0" y="520.0" font-size="21" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">No</text><rect x="100" y="800" width="1720" height="170" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="10 7"/><text x="960.0" y="859.92" font-size="19" text-anchor="middle" dominant-baseline="central">The policy engine checks automatically using the delegation and admission rules pre-signed by the Owner; admission status and fact verification are recorded separately.</text><text x="960.0" y="885.0" font-size="19" text-anchor="middle" dominant-baseline="central">Version, ciphertext commitment, local receipt and background proof have independent statuses; a local receipt is not on-chain anchoring.</text><text x="960.0" y="910.0799999999999" font-size="19" text-anchor="middle" dominant-baseline="central">"Searchable, exportable, deletable" is a set of authorized operations, not a sequence.</text></svg>