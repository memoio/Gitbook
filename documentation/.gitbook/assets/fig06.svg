<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="80" y="90" width="360" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="260.0" y="140.0" font-size="24" text-anchor="middle" dominant-baseline="central">用户根密钥</text><rect x="560" y="90" width="440" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="780.0" y="124.16" font-size="24" text-anchor="middle" dominant-baseline="central">命名空间 / 对象</text><text x="780.0" y="155.84" font-size="24" text-anchor="middle" dominant-baseline="central">数据密钥</text><rect x="1120" y="90" width="380" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1310.0" y="140.0" font-size="24" text-anchor="middle" dominant-baseline="central">加密 State Object</text><path d="M440,140.0 L560,140.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1000,140.0 L1120,140.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="80" y="380" width="360" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="260.0" y="430.0" font-size="24" text-anchor="middle" dominant-baseline="central">受限委托</text><rect x="620" y="380" width="320" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="780.0" y="430.0" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Gateway</text><rect x="1120" y="380" width="300" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1270.0" y="430.0" font-size="24" text-anchor="middle" dominant-baseline="central">撤销</text><path d="M440,430.0 L620,430.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1120,430.0 L940,430.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M780.0,380 L780.0,190" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="790" y="285.0" font-size="20" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">授权后获得限定能力</text><rect x="80" y="700" width="360" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="260.0" y="750.0" font-size="24" text-anchor="middle" dominant-baseline="central">硬撤销</text><rect x="580" y="700" width="560" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="860.0" y="734.16" font-size="24" text-anchor="middle" dominant-baseline="central">轮换密钥并重新加密</text><text x="860.0" y="765.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">新版本</text><path d="M440,750.0 L580,750.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1560" y="90" width="320" height="430" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="10 7"/><text x="1720.0" y="254.84" font-size="19" text-anchor="middle" dominant-baseline="central">密钥层级：根密钥 →</text><text x="1720.0" y="279.92" font-size="19" text-anchor="middle" dominant-baseline="central">数据密钥 → 加密对象。</text><text x="1720.0" y="305.0" font-size="19" text-anchor="middle" dominant-baseline="central">Gateway 获得的只是</text><text x="1720.0" y="330.08000000000004" font-size="19" text-anchor="middle" dominant-baseline="central">限定能力，平台不</text><text x="1720.0" y="355.16" font-size="19" text-anchor="middle" dominant-baseline="central">取得用户根密钥。</text><rect x="1200" y="640" width="680" height="250" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="10 7"/><text x="1540.0" y="727.38" font-size="19" text-anchor="middle" dominant-baseline="central">轮换对象是内容数据密钥，不是 Agent 身份签名密钥。</text><text x="1540.0" y="752.46" font-size="19" text-anchor="middle" dominant-baseline="central">撤销在执行点确认生效后约束后续受控请求；</text><text x="1540.0" y="777.54" font-size="19" text-anchor="middle" dominant-baseline="central">重新加密针对新封装，已读明文、旧密文及</text><text x="1540.0" y="802.62" font-size="19" text-anchor="middle" dominant-baseline="central">对应密钥副本不会自动被追回。</text></svg>