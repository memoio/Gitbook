<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="100" y="60" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="110.0" font-size="24" text-anchor="middle" dominant-baseline="central">选择范围</text><rect x="720" y="60" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="94.16" font-size="24" text-anchor="middle" dominant-baseline="central">生成并加密</text><text x="960.0" y="125.84" font-size="24" text-anchor="middle" dominant-baseline="central">Memory Pack</text><rect x="1340" y="60" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="94.16" font-size="24" text-anchor="middle" dominant-baseline="central">指定接收方、</text><text x="1580.0" y="125.84" font-size="24" text-anchor="middle" dominant-baseline="central">用途与期限</text><rect x="1340" y="300" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="334.16" font-size="24" text-anchor="middle" dominant-baseline="central">验证接收 Agent</text><text x="1580.0" y="365.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">身份与委托</text><rect x="720" y="300" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="334.16" font-size="24" text-anchor="middle" dominant-baseline="central">校验 schema、</text><text x="960.0" y="365.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">来源与 commitment</text><rect x="100" y="300" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="350.0" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">自动冲突策略</text><path d="M580,110.0 L720,110.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1200,110.0 L1340,110.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1580.0,160 L1580.0,300" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1340,350.0 L1200,350.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M720,350.0 L580,350.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="100" y="560" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="610.0" font-size="24" text-anchor="middle" dominant-baseline="central">提交新版本</text><rect x="720" y="560" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="610.0" font-size="24" text-anchor="middle" dominant-baseline="central">保留分支并隔离</text><path d="M240.0,400 L240.0,480.0 L340.0,480.0 L340.0,560" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="255" y="495.65" font-size="19" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">无冲突 / 去重追加 /</text><text x="255" y="520.35" font-size="19" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">独立字段合并</text><path d="M440.0,400 L440.0,480 L960.0,480 L960.0,560" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="660" y="455.0" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">规则不满足</text><rect x="280" y="820" width="760" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="660.0" y="875.0" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">生成导出、接收与导入回执</text><path d="M240.0,660 L240.0,740 L660.0,740 L660.0,820" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="300" y="718.0" font-size="18" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">记录提交结果</text><path d="M860.0,660 L860.0,740 L660.0,740 L660.0,820" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="790" y="718.0" font-size="18" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">记录隔离结果</text><rect x="1300" y="560" width="560" height="400" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="10 7"/><text x="1580.0" y="697.3" font-size="19" text-anchor="middle" dominant-baseline="central">commitment 须按算法与范围核验；</text><text x="1580.0" y="722.38" font-size="19" text-anchor="middle" dominant-baseline="central">重新加密或格式转换时密文摘要</text><text x="1580.0" y="747.4599999999999" font-size="19" text-anchor="middle" dominant-baseline="central">可能变化，需保留对应映射，</text><text x="1580.0" y="772.54" font-size="19" text-anchor="middle" dominant-baseline="central">不能仅用“哈希不变”保证成功。</text><text x="1580.0" y="797.62" font-size="19" text-anchor="middle" dominant-baseline="central">回执只反映各自事件，</text><text x="1580.0" y="822.6999999999999" font-size="19" text-anchor="middle" dominant-baseline="central">不代表自动转让全部权利。</text></svg>