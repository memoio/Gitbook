<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="100" y="80" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="135.0" font-size="24" text-anchor="middle" dominant-baseline="central">1  创建隔离工作空间</text><rect x="720" y="80" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="135.0" font-size="24" text-anchor="middle" dominant-baseline="central">2  登记用户与 Agent</text><rect x="1340" y="80" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="119.16" font-size="24" text-anchor="middle" dominant-baseline="central">3  加载 Owner 签署的</text><text x="1580.0" y="150.84" font-size="24" text-anchor="middle" dominant-baseline="central">有限委托</text><rect x="1340" y="350" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="389.16" font-size="24" text-anchor="middle" dominant-baseline="central">4  策略准入后写入</text><text x="1580.0" y="420.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">记忆与资料</text><rect x="720" y="350" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="389.16" font-size="24" text-anchor="middle" dominant-baseline="central">5  执行任务并保存</text><text x="960.0" y="420.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">Checkpoint</text><rect x="100" y="350" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="405.0" font-size="24" text-anchor="middle" dominant-baseline="central">6  中断后恢复</text><rect x="100" y="620" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="675.0" font-size="24" text-anchor="middle" dominant-baseline="central">7  查看来源与回执</text><rect x="720" y="620" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="659.16" font-size="24" text-anchor="middle" dominant-baseline="central">8  撤销后再次读取</text><text x="960.0" y="690.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">应被拒绝</text><rect x="1340" y="620" width="480" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="659.16" font-size="24" text-anchor="middle" dominant-baseline="central">9  以独立授权</text><text x="1580.0" y="690.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">导出并清理</text><path d="M580,135.0 L720,135.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1200,135.0 L1340,135.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1580.0,190 L1580.0,350" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1340,405.0 L1200,405.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M720,405.0 L580,405.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M340.0,460 L340.0,620" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M580,675.0 L720,675.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1200,675.0 L1340,675.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1000" y="847.65" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">撤销测试针对相应执行点的受控访问；导出与清理脚本使用 Owner 预先签署的独立有效委托。</text><text x="1000" y="872.35" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">清理范围仅为隔离工作空间中的测试对象；恢复范围由 Checkpoint 中的依赖版本和外部动作记录限定。</text></svg>