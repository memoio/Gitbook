<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="60" y="470" width="130" height="70" fill="#fff" stroke="#000" stroke-width="2.5" stroke-dasharray="10 7"/><text x="125.0" y="505.0" font-size="22" text-anchor="middle" dominant-baseline="central">起点</text><rect x="270" y="440" width="300" height="130" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="420.0" y="505.0" font-size="30" text-anchor="middle" dominant-baseline="central" font-weight="700">Active</text><rect x="830" y="440" width="300" height="130" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="980.0" y="505.0" font-size="30" text-anchor="middle" dominant-baseline="central" font-weight="700">Deleting</text><rect x="1390" y="440" width="300" height="130" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1540.0" y="505.0" font-size="30" text-anchor="middle" dominant-baseline="central" font-weight="700">Deleted</text><rect x="1790" y="470" width="90" height="70" fill="#fff" stroke="#000" stroke-width="2.5" stroke-dasharray="10 7"/><text x="1835.0" y="505.0" font-size="20" text-anchor="middle" dominant-baseline="central">终</text><path d="M190,505.0 L270,505.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M570,505.0 L830,505.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="700" y="485.0" font-size="22" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">删除请求</text><path d="M1130,505.0 L1390,505.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1260" y="457.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">原文与派生项</text><text x="1260" y="483.0" font-size="20" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">按策略处理</text><path d="M1690,505.0 L1790,505.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M360,440 L360,330 L480,330 L480,440" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="420" y="295.0" font-size="22" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">受权导出并记录事件</text><text x="960" y="746.35" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">这里只表达对象删除生命周期；导出是事件，可使源对象保持 Active。</text><text x="960" y="773.65" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">不把授权撤销或数据密钥轮换并入这条状态链；Deleting 与 Deleted 的完成范围按后端与保留策略解释。</text></svg>