baseline="central">按动作语义补偿</text><text x="980.0" y="945.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">并记录失败</text><rect x="1380" y="880" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1620.0" y="914.16" font-size="24" text-anchor="middle" dominant-baseline="central">查询与对账，</text><text x="1620.0" y="945.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">不自动重复</text><path d="M1230.0,750 L1230.0,810 L320.0,810 L320.0,880" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="330" y="790.0" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">成功</text><path d="M1350.0,750 L1350.0,810 L980.0,810 L980.0,880" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1000" y="790.0" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">明确失败</text><path d="M1470.0,750 L1470.0,810 L1620.0,810 L1620.0,880" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1620" y="790.0" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">未知</text><rect x="1580" y="110" width="300" height="480" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="10 7"/><text x="1730.0" y="231.2" font-size="18" text-anchor="middle" dominant-baseline="central">第一道检查验证</text><text x="1730.0" y="254.95999999999998" font-size="18" text-anchor="middle" dominant-baseline="central">独立委托；第二道</text><text x="1730.0" y="278.71999999999997" font-size="18" text-anchor="middle" dominant-baseline="central">自动验证 Owner</text><text x="1730.0" y="302.48" font-size="18" text-anchor="middle" dominant-baseline="central">预签策略中的用途、</text><text x="1730.0" y="326.24" font-size="18" text-anchor="middle" dominant-baseline="central">额度、目标与风险</text><text x="1730.0" y="350.0" font-size="18" text-anchor="middle" dominant-baseline="central">约束。补偿依赖</text><text x="1730.0" y="373.76" font-size="18" text-anchor="middle" dominant-baseline="central">外部动作语义，</text><text x="1730.0" y="397.52" font-size="18" text-anchor="middle" dominant-baseline="central">不保证一律回滚。</text><text x="1730.0" y="421.28" font-size="18" text-anchor="middle" dominant-baseline="central">operation_id 与</text><text x="1730.0" y="445.03999999999996" font-size="18" text-anchor="middle" dominant-baseline="central">执行前 Checkpoint</text><text x="1730.0" y="468.8" font-size="18" text-anchor="middle" dominant-baseline="central">先于外部执行记录。</text></svg>