<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="80" y="70" width="420" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="290.0" y="120.0" font-size="24" text-anchor="middle" dominant-baseline="central">Vault 加密状态</text><rect x="640" y="70" width="520" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="900.0" y="120.0" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">Gateway 处理授权</text><rect x="1300" y="70" width="440" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1520.0" y="120.0" font-size="24" text-anchor="middle" dominant-baseline="central">不交付输入</text><path d="M500,120.0 L640,120.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1160,120.0 L1300,120.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1230.0" y="100.0" font-size="21" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">拒绝</text><rect x="640" y="320" width="520" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="900.0" y="375.0" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">受控环境解密与执行</text><path d="M900.0,170 L900.0,320" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="920" y="232.65" font-size="19" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">允许且满足</text><text x="920" y="257.35" font-size="19" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">环境要求</text><rect x="640" y="560" width="520" height="110" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="900.0" y="599.16" font-size="24" text-anchor="middle" dominant-baseline="central">结果、运行摘要</text><text x="900.0" y="630.8399999999999" font-size="24" text-anchor="middle" dominant-baseline="central">与可用证明</text><path d="M900.0,430 L900.0,560" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="260" y="820" width="440" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="480.0" y="870.0" font-size="24" text-anchor="middle" dominant-baseline="central">写回新的 State Object</text><rect x="1100" y="820" width="520" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1360.0" y="870.0" font-size="24" text-anchor="middle" dominant-baseline="central">Proof / Attestation</text><path d="M800.0,670 L800.0,745 L480.0,745 L480.0,820" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><path d="M1000.0,670 L1000.0,745 L1360.0,745 L1360.0,820" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1300" y="300" width="580" height="380" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="10 7"/><text x="1590.0" y="414.76" font-size="19" text-anchor="middle" dominant-baseline="central">解密发生在受控执行环境内，</text><text x="1590.0" y="439.84" font-size="19" text-anchor="middle" dominant-baseline="central">Vault 原文并非默认公开，</text><text x="1590.0" y="464.92" font-size="19" text-anchor="middle" dominant-baseline="central">Gateway 也不永久持有全部明文。</text><text x="1590.0" y="490.0" font-size="19" text-anchor="middle" dominant-baseline="central">可用证明不等于业务验收成功；</text><text x="1590.0" y="515.08" font-size="19" text-anchor="middle" dominant-baseline="central">环境保护范围取决于实际硬件、</text><text x="1590.0" y="540.16" font-size="19" text-anchor="middle" dominant-baseline="central">软件与信任条件。</text><text x="1590.0" y="565.24" font-size="19" text-anchor="middle" dominant-baseline="central">写回表示形成新的版本化状态对象。</text></svg>