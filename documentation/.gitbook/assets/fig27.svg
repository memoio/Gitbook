ound">重试 + PAYMENT-SIGNATURE</text><path d="M700,334 L1200,334" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="950.0" y="318.0" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">verify</text><path d="M1200,380 L700,380" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="11 8" marker-end="url(#ah)"/><text x="950.0" y="364.0" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">验证结果 → verified / failed</text><path d="M700,462 L1200,462" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="950.0" y="446.0" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">settle（先结算）</text><path d="M1200,508 L700,508" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="11 8" marker-end="url(#ah)"/><text x="950.0" y="492.0" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">SettlementResponse → settled / failed / unknown</text><path d="M700,544 L770,544 L770,566 L700,566" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="782" y="554.0" font-size="16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">交付前重查委托与策略</text><path d="M700,636 L1700,636" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="1200.0" y="620.0" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">执行已授权服务</text><path d="M1700,682 L700,682" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="11 8" marker-end="url(#ah)"/><text x="1200.0" y="666.0" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">业务结果与服务证据</text><path d="M700,718 L770,718 L770,740 L700,740" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="782" y="728.0" font-size="16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">成功留痕；明确失败补偿；未知查询对账</text><path d="M700,774 L200,774" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="11 8" marker-end="url(#ah)"/><text x="450.0" y="758.0" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">结果、PAYMENT-RESPONSE 与各自状态</text><path d="M700,846 L770,846 L770,868 L700,868" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="782" y="856.0" font-size="16" text-anchor="start" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">已结算按策略补偿；未知结算查单</text><path d="M700,902 L200,902" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="11 8" marker-end="url(#ah)"/><text x="450.0" y="886.0" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">拒绝或对账状态与回执</text><path d="M700,984 L200,984" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="11 8" marker-end="url(#ah)"/><text x="450.0" y="968.0" font-size="16" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">payment_status=failed，不结算、不执行业务</text></svg>