45.0" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/><text x="960" y="962.65" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">密钥封装指向接收组织或 Agent，并非交出发送方身份私钥；A2A 或安全传输不替代接收端验签、来源与策略校验；</text><text x="960" y="987.35" font-size="19" text-anchor="middle" dominant-baseline="central" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">交接范围有选择，不等于整库共享。</text></svg>