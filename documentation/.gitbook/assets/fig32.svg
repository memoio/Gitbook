<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Noto Sans CJK SC','Noto Sans CJK JP','DejaVu Sans',sans-serif"><rect width="1920" height="1080" fill="#fff"/><defs><marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs><rect x="100" y="60" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="110.0" font-size="24" text-anchor="middle" dominant-baseline="central">导入会话 / 轨迹 / 文件</text><rect x="720" y="60" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="110.0" font-size="24" text-anchor="middle" dominant-baseline="central">保留原文与来源</text><rect x="1340" y="60" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="110.0" font-size="24" text-anchor="middle" dominant-baseline="central">提取 Candidate Memory</text><rect x="1340" y="320" width="480" height="120" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="1580.0" y="364.16" font-size="24" text-anchor="middle" dominant-baseline="central" font-weight="700">签名、来源、用途与</text><text x="1580.0" y="395.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central">冲突策略通过？</text><rect x="720" y="320" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="960.0" y="370.0" font-size="24" text-anchor="middle" dominant-baseline="central">写入已准入记忆</text><rect x="100" y="320" width="480" height="100" fill="#fff" stroke="#000" stroke-width="2.5"/><text x="340.0" y="354.16" font-size="24" text-anchor="middle" dominant-baseline="central">保存版本、承诺与</text><text x="340.0" y="385.84000000000003" font-size="24" text-anchor="middle" dominant-baseline="central"